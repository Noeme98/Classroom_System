<!--
  Supabase Dashboard → Authentication → Email Templates → "Confirm signup"
  Paste the Subject and Body below (replace the default link-only template).

  Without {{ .Token }} in the email, users only get a link and the in-app OTP field has nothing to enter.
-->

Subject: Confirm your signup

<!DOCTYPE html>
<html>
<body style="font-family: sans-serif; line-height: 1.6; color: #111;">
  <h2 style="margin-top: 0;">Confirm your signup</h2>
  <p>Your verification code is:</p>
  <p style="font-size: 28px; font-weight: bold; letter-spacing: 0.25em; margin: 16px 0;">{{ .Token }}</p>
  <p style="font-size: 13px; color: #444;">Enter this code in the app to finish creating your account. It expires shortly.</p>
  <hr style="border: none; border-top: 1px solid #ddd; margin: 24px 0;">
  <p style="font-size: 13px; color: #666;">Or confirm by link:</p>
  <p><a href="{{ .ConfirmationURL }}">Confirm your mail</a></p>
  <p style="font-size: 12px; color: #888; margin-top: 32px;">You're receiving this because you signed up for an app powered by Supabase.</p>
</body>
</html>
